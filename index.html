<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Strategy Visualiser</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --green: #538d4e;
            --yellow: #b59f3b;
            --gray: #3a3a3c;
            --light-gray: #818384;
            --border-color: #333;
            --panel-bg: #1e1e1e;
            --red: #e74c3c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Wordle Tile Header --- */
        .title-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .wordle-title {
            display: inline-flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .title-tile {
            width: 56px;
            height: 56px;
            border: 2.5px solid #565758;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            box-sizing: border-box;
            animation: popIn 0.3s ease-in-out;
        }

        .title-tile.green {
            background-color: var(--green);
            border-color: var(--green);
        }

        .title-tile.gray {
            background-color: var(--gray);
            border-color: var(--gray);
        }

        .title-tile.yellow {
            background-color: var(--yellow);
            border-color: var(--yellow);
        }

        .subtitle {
            letter-spacing: 5px;
            font-size: 15px;
            color: var(--light-gray);
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 8px;
        }

        /* --- Action Buttons Container --- */
        .action-container {
            max-width: 600px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            gap: 12px;
            box-sizing: border-box;
        }

        input[type="file"] {
            display: none;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            cursor: pointer;
            background-color: var(--green);
            color: #fff;
            border: 1.5px solid var(--green);
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 8px rgba(83, 141, 78, 0.25);
        }

        .btn-action:hover {
            background-color: #6aaa64;
            border-color: #6aaa64;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(83, 141, 78, 0.35);
        }

        .upload-icon {
            font-size: 13px;
        }

        /* --- Stats Section --- */
        #stats-container {
            max-width: 600px;
            margin: 0 auto 20px auto;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        .stat-row {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .grid-1x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        /* 2x2 Layout for Tries 2 through 5 */
        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        /* Container for 6 Tries below 2x2 grid */
        .tries-six-container {
            width: 100%;
            margin-top: 10px;
        }

        .stat-box {
            background: #2a2a2a;
            border-radius: 6px;
            padding: 12px 8px;
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
        }

        .stat-val {
            font-size: 22px;
            font-weight: bold;
            color: var(--green);
            margin-bottom: 4px;
        }

        .stat-box.small .stat-val {
            font-size: 18px;
            color: var(--text-color);
        }

        .stat-label {
            font-size: 11px;
            color: var(--light-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Info Icon Styling --- */
        .info-btn {
            position: absolute;
            top: 6px;
            left: 6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #3a3a3c;
            color: var(--light-gray);
            font-size: 10px;
            font-weight: bold;
            font-family: serif;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid #4a4a4c;
            transition: background-color 0.2s, color 0.2s, transform 0.15s ease;
            user-select: none;
            line-height: 1;
        }

        .info-btn:hover {
            background-color: #565758;
            color: #ffffff;
            transform: scale(1.1);
        }

        /* --- Search Controls --- */
        .controls-container {
            max-width: 600px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .search-box {
            display: flex;
            flex-direction: row;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            height: 38px;
            padding: 0 12px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            letter-spacing: 1px;
            outline: none;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: var(--green);
        }

        .search-btn {
            height: 38px;
            padding: 0 16px;
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            transition: background 0.2s;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .search-btn:hover {
            background: #6aaa64;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- Search Result Section --- */
        #search-result-container {
            max-width: 600px;
            margin: 0 auto 20px auto;
            background: var(--panel-bg);
            padding: 0 20px 20px 20px;
            border-radius: 8px;
            box-sizing: border-box;
            position: relative;
        }

        .result-header {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .close-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            background-color: var(--red);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, transform 0.15s ease;
            line-height: 1;
        }

        .close-btn:hover {
            background-color: #c0392b;
        }

        .search-result-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .path-steps-list {
            flex: 1;
        }

        .search-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1;
        }

        .badge-found {
            background-color: var(--green);
            color: #fff;
        }

        .badge-calculated {
            background-color: var(--yellow);
            color: #fff;
        }

        .path-step {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .path-step:last-child {
            margin-bottom: 0;
        }

        .step-number {
            font-size: 14px;
            font-weight: bold;
            color: var(--light-gray);
            width: 20px;
        }

        .add-tree-btn {
            padding: 6px 12px;
            background-color: var(--green);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            line-height: 1;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
            align-self: center;
        }

        .add-tree-btn:hover {
            background-color: #6aaa64;
        }

        /* --- Tree Section --- */
        #tree-container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            box-sizing: border-box;
        }

        .word-row {
            display: inline-flex;
            gap: 4px;
        }

        .letter {
            width: 26px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 14px;
        }

        .letter.g { background-color: var(--green); }
        .letter.y { background-color: var(--yellow); }
        .letter._ { background-color: var(--gray); }
        
        details {
            margin-left: 8px;
            border-left: 2px solid var(--border-color);
            padding-left: 8px;
            margin-top: 6px;
        }

        summary {
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            padding: 6px 0;
            border-radius: 4px;
        }

        summary:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        summary::-webkit-details-marker { display: none; }
        
        .arrow {
            font-size: 10px;
            color: #888;
            transition: transform 0.2s;
            width: 14px;
            display: inline-block;
            text-align: center;
        }

        details[open] > summary .arrow {
            transform: rotate(90deg);
        }
        
        .next-guess {
            margin: 6px 0 6px 20px;
            font-size: 13px;
            font-weight: bold;
            color: #bbb;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
        }

        .next-guess::before {
            content: '▶';
            color: #666;
            font-size: 16px;
        }

        .win {
            margin-left: 8px;
            font-size: 14px;
            color: var(--green);
            font-weight: bold;
        }

        .root-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 4px;
            color: #fff;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        @media (max-width: 480px) {
            .title-tile {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            .search-result-content {
                flex-direction: row;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <div class="title-container">
        <div class="wordle-title">
            <div class="title-tile green">W</div>
            <div class="title-tile gray">O</div>
            <div class="title-tile yellow">R</div>
            <div class="title-tile green">D</div>
            <div class="title-tile gray">L</div>
            <div class="title-tile yellow">E</div>
        </div>
        <div class="subtitle">Strategy Visualiser</div>
    </div>

    <div class="action-container">
        <label class="btn-action">
            <input type="file" id="file-upload" accept=".txt" />
            <span class="upload-icon">📂</span> Upload
        </label>
    </div>

    <div id="stats-container" class="hidden">
        <div class="grid-1x2">
            <div class="stat-box">
                <div class="stat-val" id="stat-avg">0.00</div>
                <div class="stat-label">Average Tries</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="stat-total" style="color: var(--yellow);">0</div>
                <div class="stat-label">Total Words</div>
            </div>
        </div>
        <div class="grid-2x2" id="distribution-row"></div>
        <div class="tries-six-container hidden" id="six-tries-row"></div>
    </div>

    <div class="controls-container">
        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="Search target word..." maxlength="5">
            <button id="search-btn" class="search-btn">Search</button>
        </div>
    </div>

    <div id="search-result-container" class="hidden"></div>

    <div id="tree-container"></div>

    <script>
        let rawTxtContent = "";
        let globalRootNode = null;
        let globalSolutionsList = [];
        let currentCalculatedPath = null;
        let currentSearchTarget = "";
        let wordsByTriesMap = {};

        window.addEventListener('DOMContentLoaded', () => {
            fetch('./solution.txt')
                .then(response => {
                    if (!response.ok) throw new Error('Default file not found');
                    return response.text();
                })
                .then(text => processData(text, true))
                .catch(err => {
                    console.log('Auto-load notice:', err);
                });
        });

        document.getElementById('file-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                processData(text, true);
            };
            reader.readAsText(file);
        });

        document.getElementById('search-btn').addEventListener('click', handleSearch);
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        const isFeedback = (token) => /^[yg_]{5}$/.test(token);

        function computeFeedback(guess, target) {
            guess = guess.toLowerCase();
            target = target.toLowerCase();
            let res = ['_', '_', '_', '_', '_'];
            let targetArr = target.split('');

            for (let i = 0; i < 5; i++) {
                if (guess[i] === target[i]) {
                    res[i] = 'g';
                    targetArr[i] = null;
                }
            }
            for (let i = 0; i < 5; i++) {
                if (res[i] !== 'g') {
                    let idx = targetArr.indexOf(guess[i]);
                    if (idx !== -1) {
                        res[i] = 'y';
                        targetArr[idx] = null;
                    }
                }
            }
            return res.join('');
        }

        function filterCandidates(candidates, guess, feedback) {
            return candidates.filter(word => computeFeedback(guess, word) === feedback);
        }

        function processData(text, resetSearch = false) {
            rawTxtContent = text.trim();
            const lines = text.split('\n');
            let root = null;
            
            let totalWords = 0;
            let totalTries = 0;
            let distribution = {};
            wordsByTriesMap = {};
            globalSolutionsList = [];
            
            for (let line of lines) {
                const tokens = line.trim().split(/\s+/);
                if (tokens.length === 0 || tokens[0] === "") continue;
                
                const hasWin = tokens.includes("ggggg");
                const triesCount = tokens.filter(isFeedback).length;
                
                if (hasWin && triesCount > 0) {
                    totalWords++;
                    totalTries += triesCount;
                    distribution[triesCount] = (distribution[triesCount] || 0) + 1;
                }

                let i = 0;
                let currentGuess = "";
                
                if (!isFeedback(tokens[0])) {
                    currentGuess = tokens[0].toLowerCase();
                    i++;
                } else {
                    if (!root) continue; 
                    currentGuess = root.guess;
                }
                
                if (!root) root = { guess: currentGuess, branches: {} };
                
                let currentNode = root;
                
                while (i < tokens.length) {
                    let feedback = tokens[i];
                    i++;
                    
                    if (i < tokens.length) {
                        let nextGuess = tokens[i].toLowerCase();
                        i++;
                        
                        if (!currentNode.branches[feedback]) {
                            currentNode.branches[feedback] = { guess: nextGuess, branches: {} };
                        }
                        currentNode = currentNode.branches[feedback];
                        currentGuess = nextGuess;
                    } else {
                        currentNode.branches[feedback] = null; 
                        if (feedback === 'ggggg') {
                            globalSolutionsList.push(currentGuess);
                            if (!wordsByTriesMap[triesCount]) {
                                wordsByTriesMap[triesCount] = [];
                            }
                            wordsByTriesMap[triesCount].push(currentGuess.toUpperCase());
                        }
                    }
                }
            }
            
            globalRootNode = root;
            renderStats(totalWords, totalTries, distribution);
            renderTree(root);
            if (resetSearch) clearSearch();
        }

        function findPathInTree(node, target, currentPath = []) {
            if (!node) return null;

            for (let feedback of Object.keys(node.branches)) {
                const nextNode = node.branches[feedback];
                const newPath = [...currentPath, { guess: node.guess, feedback: feedback }];

                if (feedback === 'ggggg' && node.guess.toLowerCase() === target.toLowerCase()) {
                    return newPath;
                }

                if (nextNode) {
                    const res = findPathInTree(nextNode, target, newPath);
                    if (res) return res;
                }
            }
            return null;
        }

        function calculatePathForNewWord(root, targetWord) {
            targetWord = targetWord.toLowerCase();
            let candidates = [...new Set(globalSolutionsList)];
            let path = [];
            let currentNode = root;

            while (currentNode) {
                let guess = currentNode.guess;
                let feedback = computeFeedback(guess, targetWord);
                path.push({ guess: guess, feedback: feedback });

                if (feedback === 'ggggg') return path;

                candidates = filterCandidates(candidates, guess, feedback);
                if (currentNode.branches[feedback]) {
                    currentNode = currentNode.branches[feedback];
                } else {
                    currentNode = null;
                }
            }

            while (candidates.length > 0) {
                let nextGuess = candidates.includes(targetWord) ? targetWord : candidates[0];
                let feedback = computeFeedback(nextGuess, targetWord);
                
                if (path.length > 0 && path[path.length - 1].guess === nextGuess) {
                    break;
                }
                
                path.push({ guess: nextGuess, feedback: feedback });
                if (feedback === 'ggggg') break;
                
                candidates = filterCandidates(candidates, nextGuess, feedback);
            }

            const lastStep = path[path.length - 1];
            if (!lastStep || lastStep.guess !== targetWord || lastStep.feedback !== 'ggggg') {
                path.push({ guess: targetWord, feedback: 'ggggg' });
            }

            return path;
        }

        function handleSearch() {
            const searchInput = document.getElementById('search-input');
            const targetWord = searchInput.value.trim().toLowerCase();

            if (!targetWord || targetWord.length !== 5) {
                alert('Please enter a valid 5-letter word.');
                return;
            }

            if (!globalRootNode) {
                alert('Please load strategy data first.');
                return;
            }

            let path = findPathInTree(globalRootNode, targetWord);
            let isCalculated = false;

            if (!path) {
                path = calculatePathForNewWord(globalRootNode, targetWord);
                isCalculated = true;
            }

            currentCalculatedPath = isCalculated ? path : null;
            currentSearchTarget = targetWord;

            renderSearchResult(targetWord, path, isCalculated);
        }

        function renderSearchResult(targetWord, path, isCalculated) {
            const container = document.getElementById('search-result-container');
            container.classList.remove('hidden');

            const badgeClass = isCalculated ? 'badge-calculated' : 'badge-found';
            const badgeText = isCalculated ? 'Calculated Path (New Word)' : 'Found in Tree';

            let html = `
                <div class="result-header">
                    <span class="search-badge ${badgeClass}">${badgeText}</span>
                    <button class="close-btn" id="close-result-btn">✖</button>
                </div>
                <div class="search-result-content">
                    <div class="path-steps-list">
            `;

            path.forEach((step, idx) => {
                const isFinalWin = (step.feedback === 'ggggg');
                html += `
                    <div class="path-step">
                        <div class="step-number">${idx + 1}</div>
                        ${createWordRow(step.guess, step.feedback)}
                        ${isFinalWin ? '<span class="win">🏆</span>' : ''}
                    </div>
                `;
            });

            html += `</div>`;

            if (isCalculated) {
                html += `<button id="add-to-tree-btn" class="add-tree-btn">ADD</button>`;
            }

            html += `</div>`;

            container.innerHTML = html;

            document.getElementById('close-result-btn').addEventListener('click', clearSearch);

            if (isCalculated) {
                document.getElementById('add-to-tree-btn').addEventListener('click', addCalculatedPathToTree);
            }
        }

        function downloadTreeTxt() {
            if (!rawTxtContent) return;

            const blob = new Blob([rawTxtContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'solution.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function addCalculatedPathToTree() {
            if (!currentCalculatedPath || currentCalculatedPath.length === 0) return;

            let stepsToAppend = currentCalculatedPath;
            if (globalRootNode && currentCalculatedPath[0].guess.toLowerCase() === globalRootNode.guess.toLowerCase()) {
                stepsToAppend = currentCalculatedPath;
            }

            let lineTokens = [];
            stepsToAppend.forEach((step, idx) => {
                if (idx > 0) {
                    lineTokens.push(step.guess);
                }
                lineTokens.push(step.feedback);
            });

            const newLine = lineTokens.join(" ");
            const updatedTxt = rawTxtContent ? `${rawTxtContent}\n${newLine}` : newLine;

            processData(updatedTxt, false);
            downloadTreeTxt();

            const addedPath = [...currentCalculatedPath];
            currentCalculatedPath = null;
            renderSearchResult(currentSearchTarget, addedPath, false);
        }

        function downloadWordsForTries(triesNum) {
            const wordList = wordsByTriesMap[triesNum] || [];
            const uniqueWords = [...new Set(wordList)];
            const content = uniqueWords.join("\n");

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${triesNum}_tries_words.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('search-result-container').classList.add('hidden');
            currentCalculatedPath = null;
            currentSearchTarget = "";
        }

        function renderStats(totalWords, totalTries, distribution) {
            const container = document.getElementById('stats-container');
            const sixRow = document.getElementById('six-tries-row');
            
            if (totalWords === 0) {
                container.classList.add('hidden');
                sixRow.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            
            const avg = (totalTries / totalWords).toFixed(2);
            document.getElementById('stat-avg').innerText = avg;
            document.getElementById('stat-total').innerText = totalWords;

            let dist2To5Html = '';

            for (let i = 2; i <= 5; i++) {
                const count = distribution[i] || 0;
                dist2To5Html += `
                    <div class="stat-box small">
                        <div class="info-btn" onclick="downloadWordsForTries(${i})" title="Download words solved in ${i} tries">i</div>
                        <div class="stat-val">${count}</div>
                        <div class="stat-label">${i} Tries</div>
                    </div>
                `;
            }

            document.getElementById('distribution-row').innerHTML = dist2To5Html;

            const countSix = distribution[6] || 0;
            if (countSix > 0) {
                sixRow.classList.remove('hidden');
                sixRow.innerHTML = `
                    <div class="stat-box small">
                        <div class="info-btn" onclick="downloadWordsForTries(6)" title="Download words solved in 6 tries">i</div>
                        <div class="stat-val">${countSix}</div>
                        <div class="stat-label">6 Tries</div>
                    </div>
                `;
            } else {
                sixRow.classList.add('hidden');
                sixRow.innerHTML = '';
            }
        }

        function createWordRow(word, feedback) {
            let html = '<div class="word-row">';
            for (let i = 0; i < 5; i++) {
                const letter = word[i] ? word[i] : '';
                const fbClass = feedback[i] ? feedback[i] : '_';
                html += `<div class="letter ${fbClass}">${letter}</div>`;
            }
            html += '</div>';
            return html;
        }

        function buildHTML(node, parentGuess) {
            if (!node || Object.keys(node.branches).length === 0) return '';
            
            let html = '';
            const branches = Object.keys(node.branches).sort();
            
            for (let feedback of branches) {
                const childNode = node.branches[feedback];
                const isWin = (feedback === 'ggggg');
                
                html += `<details ${isWin ? 'open' : ''}>`;
                html += '<summary>';
                html += `<span class="arrow">${isWin ? ' ' : '▶'}</span>`;
                html += createWordRow(parentGuess, feedback);
                
                if (isWin) {
                    html += '<span class="win">🏆</span>';
                }
                html += '</summary>';
                
                if (childNode) {
                    html += `<div class="next-guess">${childNode.guess.toUpperCase()}</div>`;
                    html += buildHTML(childNode, childNode.guess);
                }
                
                html += '</details>';
            }
            return html;
        }

        function renderTree(root) {
            const container = document.getElementById('tree-container');
            if (!root) {
                container.innerHTML = '<p style="text-align:center; color: #ff5555;">Invalid file format.</p>';
                return;
            }
            
            let html = `<div class="root-title">Opener: ${root.guess}</div>`;
            html += buildHTML(root, root.guess);
            container.innerHTML = html;
        }
    </script>
</body>
</html>
